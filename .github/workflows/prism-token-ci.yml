name: Prism Token CI

# Gates the Prism token pipeline on every pull request into main:
# validates the token source files, regenerates the CSS from them, and
# fails if regeneration produces any change that isn't already committed
# (i.e. the committed src/styles/prism-generated.css has drifted from the
# token sources that are supposed to produce it).
#
# Also runs the protected-token/value-integrity guardrails and the
# alias-regression detector (see ai/token-guardrails.md) — these are what
# actually catch a corrupted brand-critical value (e.g. the red
# royalBlue.700 / green neutral.800 incidents); "tokens:validate" and the
# regeneration-drift check above only prove the token set is *structurally*
# valid, not that any individual value is the one that was approved.
#
# Also runs a self-approval guard: an automated figma-sync/* branch is
# never allowed to modify tokens/protected-tokens.json in the same PR that
# proposes a token-source change — that file is a human, design-owner
# approval record, and a process cannot be trusted to police its own
# self-approval. This is deliberately a repo-review recommendation too, not
# only a CI check: branch-protection / required-reviewer rules on
# tokens/protected-tokens.json (via a CODEOWNERS entry, where the GitHub
# account/plan structure supports required reviews on specific paths)
# should require the design owner's review for any change to that file,
# independent of this CI gate.
#
# Lint is intentionally NOT run here. The repo currently has 4 known,
# pre-existing, unrelated lint failures (react-refresh export-shape rules
# in button.tsx/chip.tsx/table.tsx, and a react-hooks set-state-in-effect
# rule in input-number.tsx) that predate this pipeline and are out of scope
# for it. Adding lint as a required — or even non-blocking — step here
# would either block unrelated PRs on pre-existing debt or add a step that
# always reports failures and trains reviewers to ignore it. Once that
# debt is cleaned up, a lint gate can be added as its own change.

"on":
  pull_request:
    branches:
      - main

# Cancel any in-progress run for the same PR when a new commit is pushed,
# so only the latest push's result matters.
concurrency:
  group: prism-token-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read-only: this workflow only checks out the repo, installs dependencies,
# and runs local scripts. It never writes back to the repository or calls
# any authenticated API, so it needs nothing beyond default read access.
permissions:
  contents: read

jobs:
  tokens:
    name: Validate and build Prism tokens
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history needed so the self-approval guard below can diff
          # this PR's head against its actual base ref.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Prism tokens
        run: npm run tokens:validate

      - name: Protected-token & value-integrity guardrails
        run: npm run tokens:guard

      - name: Alias-regression detection
        run: npm run tokens:alias-debt

      - name: Guard against sync branches self-approving protected tokens
        run: npm run tokens:no-self-approval
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Token-guardrail tests
        run: npm run test:token-guardrails

      - name: Regenerate Prism tokens
        run: npm run tokens:generate

      - name: Verify generated files are committed
        run: git diff --exit-code

      - name: Build
        run: npm run build
