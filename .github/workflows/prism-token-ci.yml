name: Prism Token CI

# Gates the Prism token pipeline on every pull request into main:
# validates the token source files, regenerates the CSS from them, and
# fails if regeneration produces any change that isn't already committed
# (i.e. the committed src/styles/prism-generated.css has drifted from the
# token sources that are supposed to produce it).
#
# Lint is intentionally NOT run here. The repo currently has 4 known,
# pre-existing, unrelated lint failures (react-refresh export-shape rules
# in button.tsx/chip.tsx/table.tsx, and a react-hooks set-state-in-effect
# rule in input-number.tsx) that predate this pipeline and are out of scope
# for it. Adding lint as a required — or even non-blocking — step here
# would either block unrelated PRs on pre-existing debt or add a step that
# always reports failures and trains reviewers to ignore it. Once that
# debt is cleaned up, a lint gate can be added as its own change.

"on":
  pull_request:
    branches:
      - main

# Cancel any in-progress run for the same PR when a new commit is pushed,
# so only the latest push's result matters.
concurrency:
  group: prism-token-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read-only: this workflow only checks out the repo, installs dependencies,
# and runs local scripts. It never writes back to the repository or calls
# any authenticated API, so it needs nothing beyond default read access.
permissions:
  contents: read

jobs:
  tokens:
    name: Validate and build Prism tokens
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Prism tokens
        run: npm run tokens:validate

      - name: Regenerate Prism tokens
        run: npm run tokens:generate

      - name: Verify generated files are committed
        run: git diff --exit-code

      - name: Build
        run: npm run build
